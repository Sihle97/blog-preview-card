<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="flex">
    <main class="blog-card">
      <img
        src="./assets/images/illustration-article.svg"
        alt="web 3 image"
        class="card-margin image-avatar"
      />

      <h2 class="learning-header">Learning</h2>

      <p class="card-margin">Published 21 Dec 2023</p>

      <h1>HTML & CSS foundations</h1>

      <p class="card-margin card-text">
        These languages are the backbone of every website, defining structure,
        content, and presentation. Greg Hooper
      </p>

      <div class="user-content">
        <img
          src="./assets/images/image-avatar.webp"
          alt="User profile image"
          class="user-image"
        />

        <h2 class="user-name">Greg Hooper</h2>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Sihle Sithole</a>.
    </footer>
  </body>
</html>
